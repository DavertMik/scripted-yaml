# The data every example in this folder is evaluated against.
# Host functions available to the examples (written in TypeScript by the application, not part of FEEL):
#   fileExists(path)      true for "coverage.tests.yml" only
#   glob(path, pattern)   true when the path matches the glob pattern
#   capitalize(text)      "checkout" -> "Checkout"
#   truncate(text, n)     cuts to n characters and adds "…"

vars:
  method: GET
  service: checkout
  project: shop
  CI: true
  REMOTE: null            # unset
  TESTOMATIO: null        # unset
  TEST_COMMAND: npx playwright test
  EXPLORBOT_URL: https://staging.example.com
  GIT_BRANCH: release/2.4
  user: { name: Ada, role: editor, projects: [shop, blog] }

prerequisites:
  coverage: true
  testomatio: false
  local: true

title: A very long product title that certainly goes past forty characters

cart:
  subtotal: 103
  weight: 4
  items:
    - name: Dune
      category: books
      price: 12
      qty: 2
      on_sale: false
    - name: Lamp
      category: home
      price: 40
      qty: 1
      on_sale: false
    - name: Emma
      category: books
      price: 8
      qty: 3
      on_sale: true
    - name: Socks
      category: socks
      price: 5
      qty: 3
      on_sale: false

customer:
  orders: [1001, 1002]
  tags: [vip, newsletter]

destination: { country: NL, city: Utrecht }
today: { year: 2026, month: 11, day: 25 }

settings:
  free_shipping_from: 50
  vip_after_orders: 10
  home_countries: [NL, BE, DE]

diff:
  files: [src/cart.ts, src/cart.test.ts, README.md]
